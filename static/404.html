<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Armand's Blog</title>
<style>
  /* Egységes 404-dizajn (a 4 oldalon azonos szerkezet): nagy 404, üzenet,
   * kereső, "Back to home" gomb. A rendszer sötét/világos beállítását követi. */
  :root {
    --accent: #ffd866; --bg: #2d2a2e; --fg: #f8f5ef; --muted: #bdbdbd;
    --input: #4d4a4e; --border: #6e7072;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --accent: #8a6d00; --bg: #f8f5ef; --fg: #3d3a40; --muted: #5a5140;
      --input: #ece7db; --border: #917f5a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--fg);
    font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
    text-align: center; padding: 1rem;
  }
  main { max-width: 26rem; width: 100%; }
  h1 { font-size: 4.5rem; margin: 0 0 .5rem; color: var(--accent); letter-spacing: 2px; }
  p { color: var(--muted); margin: 0 0 1.6rem; line-height: 1.5; }
  .search { position: relative; margin-bottom: 1.4rem; }
  input {
    width: 100%; padding: .6rem .9rem; border-radius: 999px;
    background: var(--input); border: 1px solid var(--border); color: var(--fg);
    font-size: 1rem; font-family: inherit; text-align: center;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .results {
    position: absolute; left: 0; right: 0; top: 100%; margin-top: .3rem;
    background: var(--input); border: 1px solid var(--border); border-radius: 12px;
    overflow: hidden; text-align: left; z-index: 5;
  }
  .results a { display: block; padding: .55rem .9rem; color: var(--accent); text-decoration: none; font-size: .95rem; }
  .results a:hover { filter: brightness(1.15); }
  .btn {
    display: inline-block; padding: .7rem 2rem; background: var(--accent); color: #212121;
    border-radius: 999px; font-weight: 700; text-decoration: none;
  }
</style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>The page you are looking for does not exist.</p>
    <div class="search" id="search-404-box" data-index="/en/index.json">
      <input id="search-404" type="search" placeholder="Search the blog…" aria-label="Search the blog" autocomplete="off">
      <div class="results" id="search-404-results" hidden></div>
    </div>
    <a class="btn" href="/en/">Back to home</a>
  </main>
  <script src="/js/fuse.min.js" defer></script>
  <script src="/js/404-search.js" defer></script>
</body>
</html>
