{{- $id := .Get "id" | default (.Get 0) -}}
{{- $title := .Get "title" | default "YouTube video" -}}
<div class="video-wrapper">
  <iframe
    src="https://www.youtube-nocookie.com/embed/{{ $id }}"
    allowfullscreen
    title="{{ $title }}"
    loading="lazy"
    width="560" height="315"
    style="border:0"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"></iframe>
</div>
<p class="video-caption"><a href="https://www.youtube.com/watch?v={{ $id }}" target="_blank" rel="noopener noreferrer">Watch on YouTube<span class="sr-only"> (opens in a new tab)</span></a> – captions/subtitles are available on the YouTube player.</p>
