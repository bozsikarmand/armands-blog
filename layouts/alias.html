<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>armands.blog</title>
  <meta name="robots" content="follow">
  <link rel="canonical" href="https://armands.blog/en/">
  <link rel="alternate" hreflang="en" href="https://armands.blog/en/">
  <link rel="alternate" hreflang="hu" href="https://armands.blog/hu/">
  <!-- Azonnali átirányítás a fejben – a stílus nélküli fehér oldal nem villan
       be (a korábbi deferelt külső script a parse után futott csak). -->
  <script>
    var lang = navigator.language || navigator.userLanguage;
    window.location.href = (lang && lang.toLowerCase().indexOf('hu') === 0) ? '/hu/' : '/en/';
  </script>
  <!-- JS-tiltás esetén az angol nyitólapra -->
  <noscript><meta http-equiv="refresh" content="0; url=/en/"></noscript>
  <style>
    html, body { height: 100%; }
    body {
      margin: 0; display: grid; place-items: center; text-align: center;
      background: #2D2A2E; color: #FCFCFA;
      font: 15px/1.6 system-ui, 'Segoe UI', sans-serif;
    }
    a { color: #FFD866; }
    @media (prefers-color-scheme: light) {
      body { background: #f8f5ef; color: #3d3a40; }
      a { color: #2c7788; }
    }
  </style>
</head>
<body>
  <p>Redirecting… <a href="/en/">English</a> · <a href="/hu/">Magyar</a></p>
</body>
</html>
