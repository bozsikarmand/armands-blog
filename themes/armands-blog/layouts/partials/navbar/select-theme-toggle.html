{{ if $.Param "enableThemeChange" }}
<button type="button" class="theme-toggle" data-theme-toggle aria-label="Toggle color theme" title="Toggle color theme">
  <svg class="theme-toggle__icon theme-toggle__icon--sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
    <circle cx="12" cy="12" r="4"></circle>
    <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
  </svg>
  <svg class="theme-toggle__icon theme-toggle__icon--moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"></path>
  </svg>
</button>
<script>
(function () {
  if (window.__themeToggleInit) return;
  window.__themeToggleInit = true;
  document.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-theme-toggle]');
    if (!btn) return;
    var root = document.getElementById('root');
    var m = (root.className.match(/theme__(\w+)/) || [])[1] || 'dark';
    var next = m === 'dark' ? 'monolight' : 'dark';
    localStorage.setItem('theme', next);
    root.className = root.className.replace(/theme__\w+/, 'theme__' + next);
    var meta = document.getElementsByName('theme-color')[0];
    if (meta) meta.setAttribute('content', next === 'dark' ? '#2D2A2E' : '#ece7db');
  });
})();
</script>
{{ end }}
