{{ if $.Param "enableLangChange" }}
<div class="lang-switch" data-lang-switch>
  <button type="button" class="lang-switch__btn" data-lang-switch-btn aria-haspopup="true" aria-expanded="false" aria-label="Select language">
    {{ partial "svgs/etc/translate.svg" (dict "width" 22 "height" 22) }}
  </button>
  <div class="lang-switch__menu" role="menu">
    {{ $pageLang := .Page.Lang }}
    {{ range .Page.AllTranslations }}
      {{ $flag := "gb" }}
      {{ if eq .Lang "hu" }}{{ $flag = "hu" }}{{ end }}
      <a href="{{ .RelPermalink }}" hreflang="{{ .Lang }}" lang="{{ .Lang }}" role="menuitem"
         class="lang-switch__item{{ if eq .Lang $pageLang }} is-active{{ end }}">
        <img src="{{ (printf "/flags/%s.svg" $flag) | relURL }}" alt="" width="18" height="13" loading="lazy">
        <span>{{ .Language.LanguageName }}</span>
      </a>
    {{ end }}
  </div>
</div>
<script>
(function () {
  if (window.__langSwitchInit) return;
  window.__langSwitchInit = true;
  document.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-lang-switch-btn]');
    document.querySelectorAll('[data-lang-switch].is-open').forEach(function (d) {
      if (!d.contains(e.target)) d.classList.remove('is-open');
    });
    if (btn) {
      var root = btn.closest('[data-lang-switch]');
      var open = root.classList.toggle('is-open');
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      document.querySelectorAll('[data-lang-switch].is-open').forEach(function (d) {
        d.classList.remove('is-open');
      });
    }
  });
})();
</script>
{{ end }}
