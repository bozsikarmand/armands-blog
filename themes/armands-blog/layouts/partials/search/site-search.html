{{ if $.Param "enableSearch" }}

<div class="search">
  <span class="icon">
    {{ partial "svgs/etc/search.svg" (dict "width" 22 "height" 22) }}
  </span>
  <input id="search" aria-label="Site Search" class="input" type="text" placeholder="{{T "search-placeholder"}}" autocomplete="off">
  <div id="search-status" class="sr-only" role="status" aria-live="polite"></div>
  <div id="search-results" class="dropdown">
    <div id="search-menu" class="dropdown-menu" role="menu">
    </div>
  </div>
</div>

{{ end }}<script>
(function () {
  if (window.__searchShortcutInit) return;
  window.__searchShortcutInit = true;
  document.addEventListener('keydown', function (e) {
    var isSlash = e.key === '/';
    var isCtrlK = (e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k';
    if (!isSlash && !isCtrlK) return;
    var tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || e.target.isContentEditable) return;
    e.preventDefault();
    var desktop = document.getElementById('search');
    var mobileBtn = document.getElementById('mobileSearchBtn');
    if (window.innerWidth >= 770 && desktop) {
      desktop.focus();
    } else if (mobileBtn) {
      mobileBtn.click();
      var mobile = document.getElementById('search-mobile');
      if (mobile) mobile.focus();
    } else if (desktop) {
      desktop.focus();
    }
  });
})();
</script>
<script>
(function () {
  if (window.__searchAnnouncerInit) return;
  window.__searchAnnouncerInit = true;
  document.addEventListener('DOMContentLoaded', function () {
    var menu = document.getElementById('search-menu');
    var status = document.getElementById('search-status');
    if (!menu || !status || !window.MutationObserver) return;
    new MutationObserver(function () {
      var items = menu.querySelectorAll('.dropdown-item');
      if (!items.length) { status.textContent = ''; return; }
      var first = items[0];
      status.textContent = first.textContent.trim() === 'No results found'
        ? 'No results found'
        : items.length + ' result(s) found';
    }).observe(menu, { childList: true, subtree: true });
  });
})();
</script>
