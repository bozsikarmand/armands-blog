image: registry.gitlab.com/pages/hugo:latest

variables:
  GIT_SUBMODULE_STRATEGY: recursive

pages:
  script:
  - hugo
  artifacts:
    paths:
    - docs
  only:
  - master

# Uptime-check: scheduled pipeline-ban fut (GitLab > Build > Pipeline schedules:
# napi/órás ütemezés létrehozandó). Ha egy oldal nem elérhető, a job pirosra áll –
# a GitLab e-mailben értesít.
uptime:
  image: curlimages/curl:latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - |
      for url in \
        https://armands.blog/ \
        https://armands.cv/ \
        https://armands.dev/ \
        https://armands.site/; do
        code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 -L "$url")
        echo "$url -> HTTP $code"
        if [ "$code" != "200" ]; then
          echo "FAILED: $url" && exit 1
        fi
      done